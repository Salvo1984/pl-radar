name: Update pilot railway map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download OSM railway geometry
        run: python3 scripts/update_pilot_railway.py
      - name: Publish pilot railway archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pilot-railway-tracks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OSM pilot railway geometry"
            git push
          fi
