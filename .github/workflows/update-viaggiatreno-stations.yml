name: Update ViaggiaTreno station monitors

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: viaggiatreno-monitor-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect station monitors
        run: python3 scripts/update_viaggiatreno_stations.py
      - name: Commit public station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/viaggiatreno-stations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ViaggiaTreno station monitor data"
            git push
          fi
